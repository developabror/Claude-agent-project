# Full-stack local deployment — db + backend + frontend.
# Up:   /redeploy --full   (or: docker compose up -d --build)
# This is the source of truth for the whole stack. Per-side test stacks live in
# backend/compose.yaml and frontend/compose.yaml (see the local-stack skill).
# Copy .env.example to .env first. Services build from each side's Dockerfile (created by /scaffold-*).
name: app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-app}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks: [backend, frontend]   # bridges both — db stays off the frontend network

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    # nginx serves the SPA and proxies /api → backend:8080 (same-origin, no CORS locally).
    ports:
      - "8080:8080"
    networks: [frontend]

volumes:
  pgdata:

networks:
  backend:   # db + backend only
  frontend:  # frontend + backend only (segmented blast radius)
